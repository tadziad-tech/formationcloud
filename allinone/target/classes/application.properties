# Base de données MySQL (local)
spring.datasource.url=jdbc:mysql://localhost:3306/gestion_formation?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
spring.datasource.username=root
spring.datasource.password=root


# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
spring.jpa.properties.hibernate.format_sql=true

# Flyway (recommandé)
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.flyway.repair-on-migrate=true

# Serveur
server.port=8080
server.error.include-message=always
server.error.include-binding-errors=always

# JWT
app.jwt.secret=FormationCloudSecretKeyForJWTTokenGeneration2024MustBe256BitsLongForHS256Algorithm
app.jwt.expiration-ms=86400000

# Base URL publique (utilisée pour QR code de vérification)
app.public-base-url=http://localhost:8080

# Stockage upload (fichiers TP, etc.) — téléchargement via /api uniquement
app.storage.upload-dir=uploads
spring.servlet.multipart.max-file-size=20MB
spring.servlet.multipart.max-request-size=25MB

# Logs
logging.level.root=INFO
logging.level.com.formationcloud=DEBUG
logging.level.org.springframework.security=INFO
logging.pattern.console=%d{HH:mm:ss.SSS} [%thread] %-5level %logger{36} - %msg%n

# Désactiver l'initialisation SQL automatique (on utilise Flyway)
spring.sql.init.mode=never
