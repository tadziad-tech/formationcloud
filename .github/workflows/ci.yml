name: CI

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: maven

      - name: Build backend (Maven)
        working-directory: allinone
        run: mvn -B -DskipTests package

      - name: Setup Node 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: allinone/frontend-react/package-lock.json

      - name: Pin npm (stable)
        run: npm i -g npm@9.9.3

      - name: Frontend versions
        working-directory: allinone/frontend-react
        run: |
          node -v
          npm -v

      - name: Install frontend deps (robuste)
        working-directory: allinone/frontend-react
        env:
          NODE_ENV: development
        run: |
          set -e
          npm config set fund false
          npm config set audit false

          echo "Try npm ci..."
          if npm ci --no-audit --no-fund; then
            echo "npm ci OK"
          else
            echo "npm ci FAILED -> fallback npm install"
            rm -rf node_modules
            npm install --no-audit --no-fund --include=dev
          fi

          echo "Sanity check: vite must exist"
          npx --no-install vite --version

      - name: Build frontend (Vite)
        working-directory: allinone/frontend-react
        env:
          NODE_ENV: development
        run: npm run build
