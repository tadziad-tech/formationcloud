name: CI

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # --- Frontend build (must run BEFORE Maven so the JAR embeds the fresh SPA) ---
      - name: Setup Node (LTS)
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: allinone/frontend-react/package-lock.json

      - name: Install + build frontend (Vite)
        working-directory: allinone/frontend-react
        run: |
          node -v
          npm -v
          npm ci --no-audit --no-fund
          npm run build

      - name: Verify SPA output is present
        run: |
          test -f allinone/src/main/resources/static/app/index.html
          test -d allinone/src/main/resources/static/app/assets

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: maven

      - name: Build backend (Maven)
        working-directory: allinone
        run: mvn -B -ntp -DskipTests package

      - name: Upload JAR artifact
        uses: actions/upload-artifact@v4
        with:
          name: formationcloud-jar
          path: allinone/target/formationcloud-platform-1.0.0.jar
