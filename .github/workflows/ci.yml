name: CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: maven

      - name: Build backend (Maven)
        working-directory: allinone
        run: mvn -B -DskipTests package

      - name: Setup Node 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: allinone/frontend-react/package-lock.json

      - name: Pin npm (stability)
        run: npm i -g npm@9.9.3

      - name: Frontend install + build (robuste)
        working-directory: allinone/frontend-react
        shell: bash
        run: |
          set -euxo pipefail

          # Force registry public (et évite les lockfiles “internes”)
          npm config set registry https://registry.npmjs.org/
          npm config set audit false
          npm config set fund false
          npm config set fetch-retries 5
          npm config set fetch-retry-mintimeout 20000
          npm config set fetch-retry-maxtimeout 120000
          npm config set fetch-timeout 300000

          node -v
          npm -v

          echo "Try npm ci..."
          if npm ci --include=dev --no-audit --no-fund; then
            echo "npm ci OK"
          else
            echo "npm ci FAILED -> fallback npm install"
            rm -rf node_modules
            npm install --include=dev --no-audit --no-fund
          fi

          npx --no-install vite --version
          npm run build
