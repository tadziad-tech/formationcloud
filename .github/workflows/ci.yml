name: CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # ========= BACKEND (Spring Boot / Maven) =========
      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: maven

      - name: Build backend (Maven)
        run: mvn -B -f allinone/pom.xml -DskipTests package

      # ========= FRONTEND (React / Vite) =========
      - name: Setup Node 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: allinone/frontend-react/package-lock.json

      - name: Pin npm (avoid npm bug)
        run: |
          npm --version
          npm i -g npm@10.2.4
          npm --version

      - name: Install frontend deps (robuste)
        working-directory: allinone/frontend-react
        run: |
          set -euxo pipefail
          node -v
          npm -v

          npm config set fund false
          npm config set audit false

          # Tentative clean install
          if npm ci --no-audit --no-fund; then
            echo "npm ci OK"
          else
            echo "::warning::npm ci failed (npm bug). Fallback to npm install."
            echo "---- npm logs ----"
            ls -la ~/.npm/_logs || true
            tail -n 200 ~/.npm/_logs/*debug-0.log || true
            npm install --no-audit --no-fund
          fi

          # Vérif: vite doit exister localement
          if [ ! -f node_modules/.bin/vite ]; then
            echo "::error::vite missing after install"
            ls -la node_modules/.bin || true
            exit 1
          fi

      - name: Build frontend (Vite)
        working-directory: allinone/frontend-react
        run: npm run build
