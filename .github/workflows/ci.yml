name: CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # ===== BACKEND =====
      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: maven

      - name: Build backend (Maven)
        working-directory: allinone
        run: mvn -DskipTests clean package

      # ===== FRONTEND =====
      # Node 18 = plus stable (et Vite supporte Node 18+)
      - name: Setup Node 18
        uses: actions/setup-node@v4
        with:
          node-version: "18"
          cache: "npm"
          cache-dependency-path: allinone/frontend-react/package-lock.json

      - name: Install frontend deps (force dev deps)
        working-directory: allinone/frontend-react
        env:
          NODE_ENV: development
          NPM_CONFIG_PRODUCTION: "false"
        run: |
          npm --version
          node --version
          npm ci --include=dev --no-audit --no-fund || (echo "npm ci failed -> fallback to npm install" && npm install --no-audit --no-fund)

      - name: Sanity check: vite exists
        working-directory: allinone/frontend-react
        run: |
          ls -la node_modules/.bin | head -n 50
          test -f node_modules/.bin/vite
          npx vite --version

      - name: Build frontend (Vite)
        working-directory: allinone/frontend-react
        run: npm run build
