name: CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # ---------- BACKEND ----------
      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: maven

      - name: Build backend (Maven)
        working-directory: allinone
        run: mvn -DskipTests package

      # ---------- FRONTEND ----------
      - name: Setup Node 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: allinone/frontend-react/package-lock.json

      - name: Install frontend deps (robust)
        working-directory: allinone/frontend-react
        run: |
          node -v
          npm -v
          # Tentative propre (CI)
          npm ci --no-audit --no-fund || (
            echo "npm ci failed -> fallback to npm install"
            npm cache clean --force
            rm -rf node_modules
            npm install --no-audit --no-fund
          )
          # Vérifie que vite existe vraiment (sinon build va planter)
          test -f node_modules/.bin/vite || (echo "ERROR: vite missing after install"; exit 1)

      - name: Build frontend (Vite)
        working-directory: allinone/frontend-react
        run: npm run build
