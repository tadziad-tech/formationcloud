name: CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # ===== BACKEND =====
      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: maven

      - name: Build backend (Maven)
        working-directory: allinone
        run: mvn -DskipTests clean package

      # ===== FRONTEND =====
      # Node 18 = plus stable que Node 20 pour éviter le bug npm "Exit handler never called"
      - name: Setup Node 18
        uses: actions/setup-node@v4
        with:
          node-version: "18"
          cache: "npm"
          cache-dependency-path: allinone/frontend-react/package-lock.json

      - name: Install frontend deps (robuste)
        working-directory: allinone/frontend-react
        env:
          NODE_ENV: development
          NPM_CONFIG_PRODUCTION: "false"
        run: |
          node --version
          npm --version

          # 1) Essai propre (CI)
          npm ci --include=dev --no-audit --no-fund || true

          # 2) Si npm a buggé, on nettoie et on fait un install classique
          if [ ! -f "node_modules/.bin/vite" ]; then
            echo "vite absent -> fallback install"
            npm cache clean --force
            rm -rf node_modules
            npm install --no-audit --no-fund
          fi

          # Check final obligatoire
          test -f node_modules/.bin/vite
          npx vite --version

      - name: Build frontend (Vite)
        working-directory: allinone/frontend-react
        run: npm run build
