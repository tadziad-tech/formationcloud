name: CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # ===== Backend (Spring Boot / Maven) =====
      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: maven

      - name: Build backend (Maven)
        working-directory: allinone
        run: mvn -B -DskipTests clean verify

      # ===== Frontend (Vite / React) =====
      - name: Setup Node 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: allinone/frontend-react/package-lock.json

      - name: Install frontend deps
        working-directory: allinone/frontend-react
        run: |
          node -v
          npm -v
          npm config set fund false
          npm config set audit false
          npm install

      - name: Build frontend (Vite)
        working-directory: allinone/frontend-react
        run: npm run build

      # (Optionnel) artifacts pour vérifier le build
      - name: Upload frontend dist
        uses: actions/upload-artifact@v4
        with:
          name: frontend-dist
          path: allinone/frontend-react/dist

      - name: Upload backend jar
        uses: actions/upload-artifact@v4
        with:
          name: backend-jar
          path: allinone/target/*.jar
