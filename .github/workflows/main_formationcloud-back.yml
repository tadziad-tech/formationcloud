name: Build and deploy JAR app to Azure Web App - formationcloud-back

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: allinone/frontend-react/package-lock.json

      - name: Install and build frontend
        working-directory: allinone/frontend-react
        run: |
          npm ci --no-audit --no-fund
          npm run build

      - name: Verify SPA output
        run: |
          test -f allinone/src/main/resources/static/app/index.html
          test -d allinone/src/main/resources/static/app/assets

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: 'maven'

      - name: Build backend with Maven
        working-directory: allinone
        run: mvn -B -ntp -DskipTests package

      - name: Upload artifact for deployment
        uses: actions/upload-artifact@v4
        with:
          name: java-app
          path: allinone/target/formationcloud-platform-1.0.0.jar

  deploy:
    runs-on: ubuntu-latest
    needs: build
    permissions:
      id-token: write
      contents: read

    steps:
      - name: Download artifact from build job
        uses: actions/download-artifact@v4
        with:
          name: java-app
          path: .

      - name: Check downloaded files
        run: ls -lah

      - name: Login to Azure
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZUREAPPSERVICE_CLIENTID_A7E87151665044F9BF55F03E16BDC110 }}
          tenant-id: ${{ secrets.AZUREAPPSERVICE_TENANTID_CF57C1C673144073AD656349905BDC15 }}
          subscription-id: ${{ secrets.AZUREAPPSERVICE_SUBSCRIPTIONID_4A3AC69211894A6EAD08D0DFF1D3A473 }}

      - name: Deploy to Azure Web App
        id: deploy-to-webapp
        uses: azure/webapps-deploy@v3
        with:
          app-name: 'formationcloud-back'
          slot-name: 'Production'
          package: '*.jar'